version: "2"
linters:
  enable:
    - errcheck
    - revive
    - govet
    - staticcheck
    - lll
  settings:
    errcheck:
      check-type-assertions: true
    govet:
      enable:
        - shadow
    revive:
      rules:
        - name: unused-parameter
          disabled: true
  exclusions:
    rules:
      - path: internal/gen/gen.go
        linters:
          - errcheck
      - path: internal/gen/gen_test.go
        linters:
          - staticcheck
formatters:
  enable:
    - goimports
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
run:
  timeout: 5m
  modules-download-mode: readonly
